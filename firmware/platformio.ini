[env:feather_rp2040]
platform = raspberrypi
board = adafruit_feather_rp2040
framework = arduino
lib_deps = adafruit/Adafruit TinyUSB Library@^3.1.0

build_flags =
  -D USE_TINYUSB
  -D CFG_TUD_CDC=1
  -D USB_VID=0x239A
  -D USB_PID=0x80F1
  -D USB_MANUFACTURER="Adafruit"
  -D USB_PRODUCT="Feather RP2040 TTL"